server {
    listen 18447 ssl;
    server_name 211.154.18.38;

    ssl_certificate /etc/astrogate-img/ip-access.crt;
    ssl_certificate_key /etc/astrogate-img/ip-access.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 75m;

    # The payment provider's callback still points at the unavailable domain.
    location = /api/payments/orders {
        default_type application/json;
        return 503 '{"detail":"IP 临时入口暂不支持支付宝充值，请使用兑换码。"}';
    }

    location / {
        proxy_pass http://127.0.0.1:43921;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
