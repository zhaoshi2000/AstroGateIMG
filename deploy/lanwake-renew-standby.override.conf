[Service]
# lego uses a TLS-ALPN challenge on port 443. Release that port only when the
# short-lived IP certificate is within three days of expiry, then restore Nginx.
ExecCondition=/bin/sh -c '! /usr/bin/openssl x509 -checkend 259200 -noout -in /opt/lanwake/lego/certificates/82.157.64.38.crt'
ExecStartPre=/bin/systemctl stop nginx
ExecStopPost=/bin/systemctl start nginx
