server {
    listen 80;
    server_name 82.157.64.38;
    return 301 https://82.157.64.38$request_uri;
}

server {
    listen 443 ssl;
    server_name 82.157.64.38;
    ssl_certificate /opt/lanwake/lego/certificates/82.157.64.38.crt;
    ssl_certificate_key /opt/lanwake/lego/certificates/82.157.64.38.key;

    client_max_body_size 75m;

    location / {
        proxy_pass http://127.0.0.1:43921;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 960s;
        proxy_read_timeout 960s;
    }
}
